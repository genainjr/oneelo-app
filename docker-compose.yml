services:
  postgres:
    image: postgres:17-alpine
    container_name: postgres
    environment:
      POSTGRES_DB: oneelo_saas
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
    ports:
      - "5433:5432"
    volumes:
      - pgdata17:/var/lib/postgresql/data
    networks:
      - network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d oneelo_saas"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: api
    restart: always
    ports:
      - "4001:4001"
    environment:
      - DATABASE_URL=postgresql://dev:dev@postgres:5432/oneelo_saas
      - JWT_SECRET=local-development-only-change-me
      - JWT_EXPIRES_IN=1d
      - CORS_ORIGIN=http://localhost:3001
      - DOCUMENT_ASSET_BASE_URL=http://web:3001
      - NODE_ENV=development
      - PORT=4001
      - RUN_MIGRATIONS=false
      - RUN_SEED=false
      - ALLOW_DESTRUCTIVE_SEED=false
    volumes:
      - ./apps/api/src:/app/src
      - ./apps/api/prisma:/app/prisma
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - network

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:4001
        - INTERNAL_API_URL=http://api:4001
    container_name: web
    restart: always
    ports:
      - "3001:3001"
    environment:
      - INTERNAL_API_URL=http://api:4001
    volumes:
      - ./apps/web/src:/app/src
      - ./apps/web/public:/app/public
    depends_on:
      - api
    networks:
      - network

volumes:
  pgdata:
  pgdata17:

networks:
  network:
    driver: bridge

